
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Traventure — Home </title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/traventure-logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="main">
    <section id="page-favorites" class="page">
        <div class="page-intro">
            <div class="eyebrow muted">YOUR PERSONAL SHORTLIST</div>
            <h1>Places you <em>love.</em></h1>
            <p>Your saved destinations, all in one place.</p>
        </div>
        <div class="explore-tools favorite-tools">
            <label class="search-box">⌕ 
                <input id="favoriteSearch" type="search" placeholder="Search favorite places, towns, or categories..." aria-label="Search favorite places">
            </label>
        </div>
        <p class="favorite-search-count" id="favoriteSearchCount" hidden></p>
        <div class="destination-grid all-grid" id="favoriteGrid"></div>
        <div id="favoriteEmpty" class="empty-state">
            <span>♡</span>
            <h3>No favorites just yet</h3>
            <p>Tap the heart on any destination to keep it here.</p>
            <button class="primary-btn" data-page="explore">Explore places ↗</button>
        </div>
        <footer>© 2026 Traventure</footer>
    </section>
</main>
 <script src="app.js"></script>
 </body>
 </html>

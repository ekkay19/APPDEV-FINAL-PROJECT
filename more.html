<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Traventure — More </title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/traventure-logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="main">
    <div class="more-backdrop" id="moreModal" hidden>
        <section class="more-panel" role="dialog" aria-modal="true" aria-labelledby="moreTitle">
            <img class="more-decoration" src="assets/pinwheel.gif" alt="" aria-hidden="true">
            <h2 id="moreTitle">More...</h2>
            <button class="more-item" data-page="favorites">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3.5h12v17l-6-4-6 4z"></path>
                </svg>
                <span>Favorite places</span>
            </button>
            <button class="more-item" data-page="memories">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 3.5h14v17H5z"></path>
                    <path d="M9 8h6M9 12h8M9 16h8"></path>
                </svg>
                <span>Memories</span>
            </button>
            <button class="more-item" data-page="achievements">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 3.5h10v5a5 5 0 0 1-10 0zM7 6H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4M12 13.5v4m-4 3h8m-6-3h4"></path>
                </svg>
                <span>Achievements &amp; Rewards</span>
            </button>
            <div class="more-themes">
                <div class="more-item theme-heading">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3.5a8.5 8.5 0 1 0 0 17h1.2a2 2 0 0 0 1.5-3.3 1.5 1.5 0 0 1 1.2-2.5H18a2.5 2.5 0 0 0 2.5-2.5A8.5 8.5 0 0 0 12 3.5z"></path>
                        <path d="M7.5 10h.1m3-3h.1m4 1h.1m-8 7h.1"></path>
                    </svg>
                    <span>Themes</span>
                </div>
                <div class="theme-options" role="group" aria-label="Choose a theme">
                    <button class="theme-choice" type="button" data-theme-choice="blue" aria-pressed="false"><span class="theme-swatch blue-swatch"></span>Blue
                    </button>
                    <button class="theme-choice" type="button" data-theme-choice="violet" aria-pressed="true"><span class="theme-swatch violet-swatch"></span>Violet
                    </button>
                    <button class="theme-choice" type="button" data-theme-choice="black" aria-pressed="false"><span class="theme-swatch black-swatch"></span>Black
                    </button>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="app.js"></script>
    
</body>
</html>
